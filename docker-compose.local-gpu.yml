# =============================================================================
# VeraLux — local-gpu deployment overlay (merge AFTER docker-compose.yml)
# =============================================================================
# Use with: ./scripts/deploy-profile.sh --profile local-gpu
#
# Start the GPU audio profile explicitly, e.g.:
#   docker compose ... --profile gpu up -d
