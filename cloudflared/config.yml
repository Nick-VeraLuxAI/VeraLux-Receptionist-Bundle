# =============================================================================
# EXAMPLE cloudflared ingress — NOT used by default docker-compose (that uses
# CLOUDFLARE_TUNNEL_TOKEN + `cloudflared tunnel run`). Copy and customize hostnames
# for a customer; do not treat this file as a production default.
# =============================================================================
tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /etc/cloudflared/credentials.json
no-autoupdate: true

# Order matters: first matching hostname wins. Anything not listed hits the final rule → HTTP 404.
# If a new public hostname should reach the control plane, add it here (then redeploy / reload tunnel).
#
# Long TTS admin preview uses POST /api/tts/preview/async + short polls so Cloudflare is less likely
# to 502 than a single multi-minute response. No extra tunnel settings required for that flow.
ingress:
  - hostname: api.example.com
    service: http://runtime:4001
  - hostname: panel.example.com
    service: http://control:4000
  - hostname: app.example.com
    service: http://control:4000
  - hostname: portal.example.com
    service: http://control:4000
  - hostname: receptionist.example.com
    service: http://control:4000
  - service: http_status:404
